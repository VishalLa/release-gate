name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

jobs:
  test-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: "TDS identity: 23f2003086@ds.study.iitm.ac.in"
        run: echo "Identity marker step"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install flask requests

      - name: Start the release-gate server
        run: |
          python app.py &
          sleep 3

      - name: Run a safe-payload test
        run: |
          python - <<'EOF'
          import requests, json, sys

          payload = {
              "target": "preview",
              "event": "pull_request",
              "ref": "refs/heads/feature-1",
              "workflow": {
                  "trigger": "pull_request",
                  "permissions": {"contents":"read","packages":"write","id-token":"none"},
                  "testsPassed": True, "matrixComplete": True, "failFast": False,
                  "actions": [{"owner":"actions","name":"checkout","ref":"v4"}]
              },
              "image": {
                  "multiStage": True, "runsAsRoot": False, "secretMode": "none",
                  "criticalVulnerabilities": 0, "digestPinned": True
              }
          }
          r = requests.post("https://release-gate-1x64.onrender.com/release-gate", json=payload)
          print(r.json())
          assert r.json()["decision"] == "promote"
          EOF
